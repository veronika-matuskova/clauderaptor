# The thresholds of sniff.sh's "too good to be true" check of a review (a code or test review, with its sidecar,
# whose verdict is ready): a soft flag when the review's diff has more lines than max_diff_lines, or when its
# session took fewer seconds, cost fewer dollars or had fewer turns than its kind's floor. Bash syntax, sourced
# ($SNIFF_CONFIG reads another file). Read only when that check applies: then every key must be set.
#
# Where the numbers come from (2026-11-24, the user's local stats db, read-only; no stats data is in the repo):
#   SELECT kind, sha, duration_s, cost_usd, num_turns FROM reviews WHERE kind = ? AND verdict = 'ready'
# for code (39 reviews) and tests (49 reviews). Each floor is the 5th percentile (nearest rank) of that kind's
# values; num_turns is missing for the reviews from before the sidecars (31 code, 40 tests have it).
# Broken timings: 4 of the 49 ready test reviews (and 6 more reviews of other verdicts) report a session time of
# 1-4 s, 1-2 turns and $0.20-0.43. Their sidecars show duration_ms below duration_api_ms (e.g. 955 ms against
# 102918 ms), and the review texts read are replies to a background task's notification: the session went on
# after it, and claude -p's result gave only the last part's time and turns (the cost is the whole session's).
# They are left out (45 test reviews used); with them, the test floors would be 2.5 s and 1 turn, which no real
# review is below. No ready code review has that.
# max_diff_lines: the 95th percentile (nearest rank) of the added plus deleted lines of
#   git diff --shortstat $(git merge-base <default branch> <sha>) <sha>
# over the 65 distinct shas of those 88 reviews, in the repos' checkouts (clauderaptor, hammnam).
max_diff_lines=1039

# The code review (/code-review): most of its work is in the skill's own subagents, so few turns of its own.
code_min_seconds=39
code_min_cost=0.24
code_min_turns=2

# The test review (--tests): a change with nothing to mutate (docs, a prompt) is reviewed in seconds.
tests_min_seconds=9
tests_min_cost=0.06
tests_min_turns=3
