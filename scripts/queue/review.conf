# The models and effort levels of the review sessions, read by review.sh (and so by pr-queue.sh, which runs it).
# Bash syntax, sourced. Models: an alias (opus, sonnet, fable, haiku) or a full model name.
# Each kind of review reads <kind>_model and <kind>_effort (the code review: code_effort_<its level>).
# Effort: low, medium, high, xhigh or max. REVIEW_MODEL and REVIEW_EFFORT override these for one run, but a
# commit already reviewed as ready is not reviewed again with other ones (the saved review's title names its own).

# The code review (/code-review) is the one that finds bugs: Opus, at one effort step above its level.
code_model=opus
code_effort_low=medium
code_effort_medium=high
code_effort_high=xhigh
code_effort_xhigh=xhigh

# The test review (--tests) and suite audit (--suite): long, mostly mechanical mutation loops, on the cheaper Sonnet.
tests_model=sonnet
tests_effort=medium

# The judge (--judge) rules on review findings and decides what goes back to the branch's agent: Opus at high.
judge_model=opus
judge_effort=high
